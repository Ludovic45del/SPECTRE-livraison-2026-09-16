[mypy]
# -----------------------------------------------------------------------------
# SOFT BASELINE — do not fail on legacy typing gaps. The CI job runs in
# warn-only mode against the whole tree.
# -----------------------------------------------------------------------------
python_version = 3.11
plugins = mypy_django_plugin.main

ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_decorators = False
strict_optional = True
show_error_codes = True
pretty = True

exclude = (?x)(
    /migrations/
    | /tests/
    | manage\.py$
    | conftest\.py$
  )

[mypy.plugins.django-stubs]
django_settings_module = config.settings

# -----------------------------------------------------------------------------
# STRICT ALLOWLIST — modules listed here are checked with --strict equivalent.
# Add a module path to graduate it from the soft baseline. Initially empty;
# grow as code gets cleaned up.
#
# Example (uncomment and adapt):
# [mypy-app.domain.fa.*]
# disallow_untyped_defs = True
# disallow_incomplete_defs = True
# check_untyped_defs = True
# warn_return_any = True
# strict_equality = True
# -----------------------------------------------------------------------------

# Third-party libs without stubs — silence noise without weakening real checks.
[mypy-factory.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True
