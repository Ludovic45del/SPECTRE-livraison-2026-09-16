[isort]
profile = black

[flake8]
max-line-length = 120
exclude = migrations
extend-ignore = E203

[mutmut]
paths_to_mutate=app/domain/
tests_dir=app/tests/unit/
runner=python -m pytest app/tests/unit -x -q --tb=no --no-header -m unit

[vulture]
paths = app
exclude = app/tests/,app/**/migrations/,app/**/conftest.py
min_confidence = 80
ignore_decorators = @receiver,@register.filter,@register.simple_tag,@property,@receiver,@admin.register
ignore_names = setUp,setUpClass,tearDown,tearDownClass,handle,Meta
